name: macOS desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      OPENSSL_STATIC: '1'
      RUSTDOCFLAGS: -D warnings
      CARGO_BUILD_JOBS: 3
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install native tooling
        run: |
          brew install openssl@3 nss poppler xmlsec1
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix nss)/bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Record native tool versions
        run: |
          mkdir -p .test-artifacts/macos
          { sw_vers; uname -m; xcodebuild -version; rustc -Vv; openssl version; xmlsec1 --version; pdfsig -v; } > .test-artifacts/macos/versions.txt 2>&1
      - run: cargo fmt --all --check
      - name: Install verified Dioxus CLI
        run: cargo xtask install-dx
      - name: Build and seal native application
        run: cargo xtask bundle --debug
      - run: cargo build --locked -p firmica-key-worker --example worker-fixture
      - run: cargo test --locked -p firmica-key-worker
      - run: cargo test --locked -p firmica-key-worker --test worker -- --ignored
      - name: Verify XAdES with the installed XMLSec version
        run: cargo test --locked -p firmica-xades --test encoding xmlsec_ -- --ignored
      - name: Extract and verify relocated bundle
        run: |
          destination="$RUNNER_TEMP/Firmica space & 'apostrophe'"
          mkdir -p "$destination"
          ditto -x -k target/dx/firmica/bundle/macos/firmica-*.zip "$destination"
          app=$(find "$destination" -maxdepth 1 -name '*.app' -type d)
          test -n "$app"
          echo "FIRMICA_TEST_APP=$app" >> "$GITHUB_ENV"
          echo "FIRMICA_TEST_WORKER=$app/Contents/MacOS/firmica-key-worker" >> "$GITHUB_ENV"
          codesign --verify --deep --strict "$app"
      - name: Install Firefox automation
        run: |
          npm ci
          npx playwright install firefox
      - name: Verify native dialogs, AutoScript and protocol 4.1 signing
        run: cargo test --locked -p xtask --test macos -- --ignored --nocapture --test-threads=1
      - run: cargo test --locked -p desktop -p xtask
      - run: cargo clippy --locked -p firmica-key-worker -p desktop -p xtask --all-targets -- -D warnings
      - run: cargo doc --locked -p firmica-key-worker -p desktop -p xtask --no-deps
      - name: Verify native provider cleanup
        run: cargo test --locked -p desktop -- --ignored --test-threads=1
      - name: Save bundle and acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-desktop-${{ matrix.os }}
          path: |
            .test-artifacts/macos/*.json
            .test-artifacts/macos/*.txt
            .test-artifacts/macos/*.log
            .test-artifacts/macos/*.png
            .test-artifacts/macos/Signing.xcresult
            .test-artifacts/macos/attachments
          if-no-files-found: warn
      - name: Save architecture-specific application bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-bundle-${{ matrix.os }}
          path: target/dx/firmica/bundle/macos/*.zip
          if-no-files-found: warn
