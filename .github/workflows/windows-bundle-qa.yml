name: Windows bundle QA

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run providing the windows-invocation artifact
        required: true
        type: string
      native_runner:
        description: Windows image for the native replay
        type: choice
        default: windows-latest
        options:
          - windows-latest
          - windows-2022

permissions:
  contents: read
  actions: read

jobs:
  native:
    runs-on: ${{ inputs.native_runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Download and check the source revision of the portable bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          $source = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" --jq '.head_sha'
          if ($LASTEXITCODE -ne 0) { throw 'cannot resolve artifact revision' }
          # This replay may change tests, but must exercise the same application and builder.
          git diff --exit-code $source HEAD -- Cargo.toml Cargo.lock packages crates .cargo tools/xtask/Cargo.toml tools/xtask/src tools/windows
          if ($LASTEXITCODE -ne 0) { throw 'bundle source differs from this checkout; rebuild it first' }
          gh run download $env:SOURCE_RUN --name windows-invocation --dir "$env:RUNNER_TEMP/source-artifact"
          if ($LASTEXITCODE -ne 0) { throw 'artifact download failed' }
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/source-artifact/target/dx/firmica/bundle/windows/*.zip")
          if ($archives.Count -ne 1) { throw 'expected exactly one portable bundle' }
          Expand-Archive $archives[0].FullName "$env:RUNNER_TEMP/firmica-portable"
          "Bundle source: $source" | Tee-Object -FilePath bundle-source.txt
      - name: Install native UI test tooling
        run: python -m pip install playwright==1.58.0 pywinauto==0.6.9 Pillow==12.1.0
      - name: Update the Evergreen WebView2 Runtime
        timeout-minutes: 5
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $before = Get-ItemPropertyValue $key -Name pv -ErrorAction SilentlyContinue
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '^CN=Microsoft Corporation,') {
            throw 'WebView2 installer signature is not valid for Microsoft Corporation'
          }
          $install = Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru
          $after = Get-ItemPropertyValue $key -Name pv -ErrorAction Stop
          New-Item -ItemType Directory -Force .test-artifacts/windows-runtime | Out-Null
          @{before=$before;after=$after;installer_exit=$install.ExitCode;sha256=(Get-FileHash $installer -Algorithm SHA256).Hash} |
            ConvertTo-Json | Set-Content .test-artifacts/windows-runtime/runtime.json
          if ($install.ExitCode -ne 0) { throw "WebView2 installer failed: $($install.ExitCode)" }
      - name: Exercise the extracted portable application
        timeout-minutes: 22
        shell: pwsh
        run: |
          $env:OPENSSL_DIR = Join-Path $env:ProgramFiles OpenSSL
          $env:OPENSSL_LIB_DIR = Join-Path $env:OPENSSL_DIR 'lib\VC\x64\MD'
          $env:OPENSSL_STATIC = '0'
          $env:FIRMICA_TEST_APP = "$env:RUNNER_TEMP/firmica-portable/firmica.exe"
          cargo test --locked -p xtask --test windows_handler -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'standard-account registration or native signing failed' }
          python -u tests/interop/windows-signing.py --app "$env:RUNNER_TEMP/firmica-portable/firmica.exe"
          if ($LASTEXITCODE -ne 0) { throw 'native signing test failed' }
          python -m playwright install firefox
          if ($LASTEXITCODE -ne 0) { throw 'Firefox installation failed' }
          python -u tests/interop/windows-browser.py --app "$env:RUNNER_TEMP/firmica-portable/firmica.exe"
          if ($LASTEXITCODE -ne 0) { throw 'browser signing test failed' }
      - name: Save native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-bundle-qa
          path: |
            .test-artifacts/windows-signing/
            .test-artifacts/windows-browser/
            .test-artifacts/windows-standard-account/
            .test-artifacts/windows-runtime/
            bundle-source.txt
          if-no-files-found: warn
