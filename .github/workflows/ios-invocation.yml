name: iOS invocation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-invocation.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'packages/mobile/**'
      - 'packages/ui/**'
      - 'tools/xtask/**'
      - 'tests/interop/ios/**'
  pull_request:
    paths:
      - '.github/workflows/ios-invocation.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'packages/mobile/**'
      - 'packages/ui/**'
      - 'tools/xtask/**'
      - 'tests/interop/ios/**'

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust and simulator target
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-ios-sim
      - name: Install verified Dioxus CLI 0.7.10
        run: cargo xtask install-dx
      - name: Build native iOS Simulator app
        run: dx build --locked --package mobile --platform ios --target aarch64-apple-ios-sim
      - name: Test Safari invocation and review
        env:
          FIRMICA_TEST_APP: target/dx/mobile/debug/ios/Mobile.app
        run: cargo test --locked -p xtask --test ios -- --ignored --nocapture
      - name: Save iOS test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-invocation
          path: |
            .test-artifacts/ios/result.json
            .test-artifacts/ios/Info.plist
            .test-artifacts/ios/xcodebuild.log
            .test-artifacts/ios/simulator.log
            .test-artifacts/ios/Invocation.xcresult
            .test-artifacts/ios/attachments
          if-no-files-found: warn
