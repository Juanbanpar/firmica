[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
description = "Firmica electronic-signature client"

[[bin]]
name = "firmica"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }

firmica-core.workspace = true
firmica-protocol.workspace = true

firmica-transport.workspace = true
tokio.workspace = true
async-channel = "2"
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
firmica-key-worker.workspace = true
firmica-signing.workspace = true
firmica-cades.workspace = true
firmica-validation.workspace = true
secrecy.workspace = true
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
tempfile = "3"
der = { version = "0.7", features = ["std"] }
openssl.workspace = true
thiserror.workspace = true
x509-cert = "0.2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemServices"] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["process"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
