[workspace]
resolver = "2"
members = [
    "packages/ui",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
    "packages/protocol",
    "packages/core",
    "packages/transport",
]

[workspace.dependencies]
dioxus = { version = "=0.7.10" }

# workspace
ui = { path = "packages/ui" }

firmica-protocol = { path = "packages/protocol" }
firmica-core = { path = "packages/core" }
firmica-transport = { path = "packages/transport" }
thiserror = "2"
percent-encoding = "2.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
jni = "0.21"
cesu8 = "1.1"
