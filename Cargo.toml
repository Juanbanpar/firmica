[workspace]
resolver = "2"
members = [
    "packages/ui",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
    "crates/protocol",
    "crates/core",
    "crates/transport",
    "crates/signing",
    "crates/certificates",
    "crates/cades",
]

[workspace.dependencies]
dioxus = { version = "=0.7.10" }

# workspace
ui = { path = "packages/ui" }

firmica-protocol = { path = "crates/protocol" }
firmica-core = { path = "crates/core" }
firmica-transport = { path = "crates/transport" }
firmica-signing = { path = "crates/signing" }
firmica-certificates = { path = "crates/certificates" }
firmica-cades = { path = "crates/cades" }
openssl = "0.10.81"
secrecy = "0.10.3"
cryptoki = "0.12.1"
thiserror = "2"
percent-encoding = "2.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
jni = "0.21"
cesu8 = "1.1"
