[package]
name = "firmica-key-worker"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
firmica-certificates.workspace = true
firmica-signing.workspace = true
secrecy.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["process", "fs", "event"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ErrorReporting", "Win32_System_Memory"] }

[dev-dependencies]
firmica-core.workspace = true
firmica-cades.workspace = true
openssl.workspace = true
tempfile = "3"
der = { version = "0.7", features = ["std", "derive"] }
