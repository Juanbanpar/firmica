[package]
name = "firmica-key-worker"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
firmica-certificates.workspace = true
firmica-signing.workspace = true
secrecy.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "fs", "event"] }

[dev-dependencies]
firmica-core.workspace = true
firmica-cades.workspace = true
openssl.workspace = true
tempfile = "3"
der = { version = "0.7", features = ["std", "derive"] }
