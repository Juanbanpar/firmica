[package]
name = "firmica-providers"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
firmica-certificates.workspace = true
firmica-key-worker.workspace = true
firmica-signing.workspace = true
secrecy.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
pkcs11-client = "0.1.1"

[target.'cfg(windows)'.dependencies]
openssl.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
openssl.workspace = true
security-framework = "3.7.0"
security-framework-sys = "2.17.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
firmica-core.workspace = true
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
firmica-core.workspace = true
